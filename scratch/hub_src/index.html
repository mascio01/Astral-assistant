<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg, #14161a);
    color: var(--fg, #e6e6e6);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  #top {
    padding: 10px 14px; background: #1d2026; border-bottom: 1px solid #2c3038;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
  }
  #top h1 { font-size: 15px; font-weight: 600; }
  .ctl { display: flex; gap: 12px; align-items: center; font-size: 11px; }
  .ctl input[type=color] {
    width: 26px; height: 26px; border: none; background: none;
    cursor: pointer; padding: 0;
  }
  #who { font-size: 12px; opacity: .75; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg {
    max-width: 72%; padding: 8px 12px; border-radius: 12px;
    word-wrap: break-word; overflow-wrap: anywhere;
    background: #262a31;
  }
  .msg.own { align-self: flex-end; background: #0078d4; color: #fff; }
  .msg.other { align-self: flex-start; }
  .msg .meta { font-size: 10px; opacity: .65; margin-bottom: 3px; }
  .msg img { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
  .msg a.dl {
    display: inline-block; margin-top: 6px; color: inherit;
    text-decoration: underline; font-size: 13px;
  }
  .sys {
    align-self: center; font-size: 12px; opacity: .55;
    font-style: italic; text-align: center;
  }
  #bar {
    padding: 10px 14px; background: #1d2026;
    border-top: 1px solid #2c3038;
    display: flex; gap: 8px; align-items: center;
  }
  #bar input[type=text] {
    flex: 1; padding: 9px 14px; border-radius: 20px;
    border: 1px solid #3a3f48; background: #262a31;
    color: inherit; outline: none; font-size: 14px;
  }
  #bar input[type=text]:focus { border-color: #0078d4; }
  button {
    cursor: pointer; border: none; border-radius: 20px;
    padding: 9px 16px; background: #0078d4; color: #fff;
    font-size: 14px; font-weight: 500;
  }
  button:hover { opacity: .88; }
  #ebtn, #fbtn { background: #333842; padding: 9px 12px; }
  #emoji {
    display: none; position: absolute; bottom: 64px; left: 14px;
    background: #262a31; border: 1px solid #3a3f48; border-radius: 10px;
    padding: 8px; width: 268px; max-height: 190px; overflow-y: auto;
    grid-template-columns: repeat(8, 1fr); gap: 2px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 50;
  }
  .eb {
    background: none; border: none; font-size: 19px;
    cursor: pointer; padding: 4px; border-radius: 5px;
    line-height: 1;
  }
  .eb:hover { background: #3a3f48; }
  #drop {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,120,212,.22);
    border: 4px dashed #0078d4; z-index: 999;
    font-size: 22px; font-weight: 600; color: #fff;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="top">
  <h1>Chat Hub</h1>
  <div class="ctl">
    <span id="who"></span>
    <label>Bg <input type="color" id="bgc" value="#14161a"></label>
    <label>Testo <input type="color" id="fgc" value="#e6e6e6"></label>
  </div>
</div>
<div id="chat"></div>
<div id="emoji"></div>
<div id="bar">
  <button id="ebtn" title="Emoji">&#128512;</button>
  <button id="fbtn" title="Allega file">&#128206;</button>
  <input type="text" id="inp" placeholder="Scrivi un messaggio..." autocomplete="off">
  <button id="sendb">Invia</button>
</div>
<input type="file" id="fsel" multiple style="display:none">
<div id="drop">Rilascia i file qui</div>
<script src="/app.js"></script>
</body>
</html>
